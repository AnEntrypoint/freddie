body: "Left open by the freddie gm drain (commit a4fe815b and follow-ups).\n\npackages/gm (tool-gm, gm-client, gm-config, gm-progress; 35 tracked files) is still wired into the runtime: packages/bundle/base/cordis.patch.yml rows, apps/cli/package.json deps, the @freddie/freddie-api-remotes mount of gm-client/remote, the GUI Overview GM metric, and the model-facing gm_* tools.\nIt still reads .gm/instructions (two tracked hook files kept for it) and the gm_prd_add tools write .gm/prd.yml (packages/client/connection/AGENTS.md:14).\nNot booted here: node_modules is absent, so the live path is unverified.\n\nDecide: remove packages/gm and its wiring (then boot the real cordis.yml and run pnpm run publint), or keep it and point its writes at work/rows.\nAlso decide the ignored disk state: .agentplug-kv/ (gitignored runtime, see du output) and vendor/gm/ if present; both are untracked and not deleted by the drain.\n\nOutput of the checks in this run: 33M\t.agentplug-kv\n35\nvendor-gm-absent\n"
