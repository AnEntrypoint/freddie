body: "Ported from .gm/prd/gm-runtime-host-hmr-activation.yml (gm queue, old format). Verbatim:\n\nid: gm-runtime-host-hmr-activation\ntitle: Activate GM runtime projection in live host\nsubject: 'Pre: the active Web Host has staged the modified GM source through the official Cordis HMR queue and has deferred disposal while the live agent loop runs. Invariant: only the hmr/idle lifecycle resumes the stashed reload; no manual process restart or runtime patch bypasses it. Post: after host HMR reloads, a real GUI GM tool call publishes runtime JSON and Overview renders GM 0.1.1362, runner 0.1.158, and current updater state.'\nacceptance: The active HMR journal records reload after idle, then a fresh GUI GM tool dispatch reaches an Overview whose GM runtime metric shows the active daemon's leaf values.\nstatus: in-progress\nroute_family: execution\nsession_id: freddie-2128598-1790941468204\nnotes:\n- ts: 2026-11-01T14:30:23.240Z\n  session_id: mcp-codemode-3535970-1793543423142-327\n  note: 'blocked_by: gm-runtime-host-hmr-activation-blocker-mcp-codemode-3535970-1793542718115-1-8 (external). Eliminate found no live Freddie Web Host (proc_list 1793543325753-465-97631920571b6bb5; exec_js 1793543376328-595-f0cd3e66733ad9a2; port 3000 is nginx 401, 1793543391534-632-edc7a47cd6b389d2). HMR journal, reload-on-idle and Overview witness need the host. Booting one here would bypass HMR, which the row forbids. Owner starts the host through the official path, waits for agent-loop idle, then runs the GUI witness. Receipts: .gm/receipts/gm-runtime-host-hmr-activation/01-orient.md to 03-eliminate.md.'\n"
