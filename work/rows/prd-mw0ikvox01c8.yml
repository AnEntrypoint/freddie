title: "Full GUI performance goal, next evidence wave after binding reuse published b564: measure actual real-keyboard composer"
body: "Ported from .gm/prd/gui-perf-next-input-startup-20261006.yml (gm queue, old format). Verbatim:\n\nid: gui-perf-next-input-startup-20261006\nsubject: 'Full GUI performance goal, next evidence wave after binding reuse published b564: measure actual real-keyboard composer input-to-paint without profiler first, then isolate measured hot work; independently measure real fresh owned browser startup critical module/activation path. Preserve existing session content, draft, caret and scroll. Optimize only a proved cost with complete invalidation/lifecycle correctness, exercise actual prior failing action after source change, remove all instrumentation and publish scoped exact source under GitHub user. Completion claim limited to witnessed costs and surfaces, never full GUI closure from one improvement.'\nSESSION_ID: gui-perf-next-20261006\nsession_id: mcp-codemode-3535970-1793544447567-488\nstatus: pending\ndescription: 'Scope (re-scoped by the executor after live ELIMINATE): proved cost is per-keystroke DOM churn in the composer. Baseline, owned headless chromium 155, gpu-free, real CDP key events: 37 DOM mutation records per keystroke, 23 of them no-op attribute writes of the `ref` key (value is String(ref callback), e.g. the textarea gets ref=\"(el) => { this.#inputEl = el }\"; outlets get ~75 char function source). Writer located by stack trace: framework/webjsx/src/attributes.js updateAttributesCore -> updatePropOrAttr, which treats `ref` as an unknown HTML key because it is not a DOM property. webjsx handles ref via assignRef (applyDiff.js:178, createDOMElement.js:27) so the attribute write is spurious. Files named: framework/webjsx/src/attributes.js (exclude the ref key in both prop loops), framework/README.md (divergence entry 22 records the exclusion). Startup (second half of the row) measured separately: 3 cold starts, textarea at 932/1148/1039 ms, 245 JS modules, 240-242 KB encoded. Input baseline p50 10.1 ms, p90 17.6 ms, max 26.1 ms over 40 keys. Draft/caret baseline: type abcdef, ArrowLeft x3, type X gives abcXdef caret 4.'\nacceptance_criteria: 'After the edit, on the committed tree in a fresh owned headless profile with real CDP key events: (1) no-op ref attribute writes per keystroke drop from 23 to 0 and textarea/outlets no longer carry a ref attribute; (2) total DOM mutation records per keystroke fall from 37 by the removed count (about 14 remain); (3) input p50/p90 are not worse than baseline 10.1/17.6 ms; (4) the composer textarea still receives focus and its ref callback still runs (#inputEl set, focus works after workspace pick); (5) draft/caret assertion abcXdef caret 4 still passes; (6) startup measurement still reports 245 modules and a textarea within the baseline band. Completion claim limited to these witnessed costs and surfaces.'\nwitness_plan: Run /tmp/gui-perf-20261006/localise3.mjs (mutation and no-op counts per keystroke, idle control 0), keys.mjs (latency), caret.mjs (draft and caret), boot.mjs x3 (cold start). Compare with the baseline evidence files under /tmp/gui-perf-20261006/evidence/.\nowner: mcp-codemode-3535970-1793544447567-488\n"
