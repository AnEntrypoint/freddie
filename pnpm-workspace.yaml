packages:
  - framework/*
  - packages/*/*
  - native/landlock-run
  - native/landlock-run/packages/*
  - apps/*
  - examples

linkWorkspacePackages: true

overrides:
  '@freddie/cosmokit': 'link:framework/cosmokit'
  '@freddie/schemastery': 'link:framework/schemastery'
  dompurify: '>=3.4.12'
  hono: '>=4.12.34'
  brace-expansion: '>=5.0.7'
  protobufjs: '>=7.6.5'
  fast-uri: '>=4.1.4'
  qs: '>=6.16.0'
  undici: '>=7.29.0'
  ip-address: '>=10.3.1'
  '@hono/node-server': '>=1.19.15'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

allowBuilds:
  esbuild: true
  node-pty: true
  protobufjs: false
  node-addon-require-builtin: false
  koffi: true
  libsql-plugkit-client@https://codeload.github.com/AnEntrypoint/libsql-plugkit-client/tar.gz/b021e1d715630a6c22705eab9095aea63d02690d: false
  '@google/genai': false

minimumReleaseAgeExclude:
  - node-addon-native-custom-loader@0.1.4
  - node-addon-require-builtin-darwin-arm64@0.1.4
  - node-addon-require-builtin-darwin-x64@0.1.4
  - node-addon-require-builtin-linux-arm64-gnu@0.1.4
  - node-addon-require-builtin-linux-x64-gnu@0.1.4
  - node-addon-require-builtin-win32-arm64-msvc@0.1.4
  - node-addon-require-builtin-win32-ia32-msvc@0.1.4
  - node-addon-require-builtin-win32-x64-msvc@0.1.4
  - node-addon-require-builtin@0.1.4

patchedDependencies:
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
