- id: gm-client-session-id-collision-risk
  title: gm-client's bundle-fixed sessionId collides across concurrent Freddie launches
  subject: 'packages/bundle/base/cordis.patch.yml hardcodes sessionId: freddie-harness-1. gm keys phase/PRD/mutables by session id. processEpoch in spool.js only uniquifies dispatch filenames; it does not partition .gm/prd.yml or phase. Two concurrent Freddie processes against the same project race one gm session. !!js already evaluates process.env / process.pid / process.cwd() on this same row.'
  acceptance: sessionId is derived per-process at plugin config eval (FREDDIE_SESSION_ID when assigned, else a pid-and-epoch token), never the literal freddie-harness-1, so two concurrent Freddie processes against the same project never share a gm session id; live-verified by reading the mounted config or a real dispatch's session_id.
  status: pending
