- SESSION_ID: harness-debug
  id: pwsh-tool-runs-windows-powershell-51
  route_family: state
  title: Live pwsh tool executes Windows PowerShell 5.1 instead of pwsh 7
  subject: The in-session pwsh tool advertised as `pwsh -Command` actually spawned Windows PowerShell 5.1 (PSVersion 5.1.26100.9278, ConsoleHost, powershell.exe at C:\WINDOWS\System32\WindowsPowerShell\v1.0\powershell.exe). Get-Command pwsh returned nothing. ConstrainedLanguage / UTF-8 / sandbox semantics documented for pwsh 7 therefore do not apply. Root-cause whether resolvePwshPath last-resorted to powershell.exe, whether pwsh 7 is missing from PATH inside the sandbox, or whether the composition points at the wrong executable — then fix so the live tool either runs real pwsh 7 or fails loud naming the missing executable.
  acceptance: 'After the fix, a live pwsh call reports PSEdition=Core and a pwsh 7+ version, OR a loud load/run error naming that pwsh was not found rather than silently running Windows PowerShell 5.1. Precondition: inventory of the live process. Invariant: no silent fallback that contradicts the model-facing contract. Postcondition: re-driven `$PSVersionTable` matches the advertised engine.'
  status: pending
- SESSION_ID: harness-debug
  id: web-search-api-key-invalid
  route_family: execution
  title: Live web_search fails with invalid API key
  subject: 'The in-session web_search tool returned ''Authentication Fails, Your api key: ****eway is invalid'' for ordinary queries. This is a live mounted-tool failure, not a missing provider: the call reached a backend that rejected credentials. Root-cause which provider (brave/tavily/serper/custom) is composed, whether FREDDIE credentials/.env is empty or stale, and fix so web_search either works or fails loud at load naming the missing/invalid key.'
  acceptance: 'A live web_search either returns real results or a load-time/run-time error that names the provider and that credentials are missing/invalid — never a truncated ''****eway is invalid'' from an unidentified backend. Precondition: inventory. Invariant: do not commit secrets. Postcondition: re-driven web_search matches the acceptance.'
  status: pending
- SESSION_ID: harness-debug
  id: gui-3080-is-a-second-process
  route_family: state
  title: Port 3080 GUI is a different process with a blank session, not this in-harness agent
  subject: Live session.list on 127.0.0.1:3080 returns only session-516e308c (blank, created ~minutes ago). This agent is session-e3825cf9. host.describe on 3080 reports model deepseek-v4-flash while ~/.freddie/settings.yaml selects xai-oauth/grok-4.6. Driving session.prompt on 3080 against this session would be the dual-writer log-corruption trap. Confirm store lock, whether 3080 is an orphaned boot, and that the in-harness agent and GUI share one writer.
  acceptance: 'Witnessed: either both surfaces list the same live session under one store lock, or the extra process is stopped/explained and the lock prevents a second writer. Precondition: inventory. Invariant: never prompt the same session from two processes. Postcondition: one writer owns the store.'
  status: pending
- SESSION_ID: harness-debug
  id: web-search-uses-official-deepseek-not-acptoapi
  route_family: state
  title: web_search hits api.deepseek.com with a chat-proxy key and 401s
  subject: Live web_search returned DeepSeek Authentication Fails (key masked ****eway). Chat is configured to DEEPSEEK_BASE_URL=http://127.0.0.1:4800/v1 (acptoapi). web-search-deepseek deliberately does NOT reuse DEEPSEEK_BASE_URL and defaults to https://api.deepseek.com/anthropic/v1. DEEPSEEK_SEARCH_BASE_URL is unset. ~/.freddie/.credentials.yaml stores DEEPSEEK_API_KEY as the two-character placeholder 'sk'. The live search still sent some other key (error mask ends eway) to official DeepSeek and 401'd. Fix so search either uses a working search endpoint/credential or fails at load/execute naming provider+missing/invalid credential, never a truncated third-party 401.
  acceptance: 'Live web_search returns sources, or a structured WEB_PROVIDER_CREDENTIAL_MISSING / WEB_PROVIDER_ERROR that names deepseek-official and that the key/endpoint is unusable. Precondition: inventory. Invariant: no committed secrets. Postcondition: re-driven web_search matches acceptance.'
  status: pending
