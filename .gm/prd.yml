- id: gm-toolview-card
  title: Dedicated presentCall/presentResult for native gm verb tools
  subject: 'packages/gm/tool-gm/src/verbs.js registers eight typed tools with no presentCall/presentResult, so Web UI falls through to GenericToolCard (raw JSON). Cookbook requires UI render intent as part of tool design. Live codesearch this session: bm25_hits[].symbol.path + line_start/line_end, vector_hits[].path, filename-mode hits[].path. Live recall this session: hits[].key/text/score — no file:line. Instruction/transition pending cards are generic summaries, not raw JSON.'
