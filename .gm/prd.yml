- session_id: gmFirstClass-1
  id: self-improvement-run-blocked-flaky-backend
  title: 'Self-improvement run blocked: acptoapi/grok backend fails reproducibly near EMIT phase across 4 consecutive launches'
  status: pending
  subject: '4 consecutive headless launches of the self-improvement run (freddie-self-improvement-long-run) all crashed on ''SERVER: All upstream providers are currently unavailable'' at nearly the same point (deep into EMIT phase, near real completion of the tool-gm work). acptoapi''s own /health endpoint and simple direct completion probes (both small and large payloads) succeeded every time I checked immediately after each crash -- ruling out a simple down-backend or payload-size explanation. The retry policy in packages/llm/llm/src/retry-policy.js already covers SERVER with 5 retries + backoff, yet the process still crashed, meaning either those retries genuinely exhausted against real intermittent xai-oauth/grok-4.6 backend flakiness under the run''s real usage pattern (streaming/tool-calling/long multi-turn context), or something in the retry wiring is not actually firing for this call path (unconfirmed -- log output does not show multiple retry attempts, only the single final failure line).'
  acceptance: Either (a) root-cause the actual retry gap if freddie-llm-retry is not firing for this call path (instrument/log retry attempts, confirm or refute), or (b) if retries are genuinely exhausting against real backend flakiness, this is an infrastructure/provider reliability issue outside this repo's tree -- document it plainly and consider raising maxRetries specifically for headless long-running compositions rather than relaunching blindly. Not resolved this session; left as an open, well-evidenced row for the next session.
  route_family: execution
- session_id: gmFirstClass-1
  id: web-ui-cross-home-session-visibility
  title: Web UI cannot see sessions from a different FREDDIE_HOME (by design, not a bug to route around)
  subject: 'User''s explicit ask: ''web page should see all runs that are going on.'' Investigated the actual mechanism: packages/session/session-persistence-jsonl/src/index.js''s claimWriterLock() enforces exactly ONE writer per sessions directory via a .writer.lock file scoped to `this.root` -- deliberate, safety-critical (prevents corrupting concurrent JSONL session logs), confirmed live (the self-improvement run''s own isolated FREDDIE_HOME was created specifically because the real ~/.freddie/sessions store is held by the live Web UI process, pid 24808). So pointing a second process''s session-persistence root at the same ~/.freddie/sessions to make it Web-UI-visible is explicitly blocked by this exact mechanism, not an oversight. No existing cross-home discovery mechanism exists anywhere in the tree (grepped for additionalHomes/otherHomes/multiHome/FREDDIE_HOMES -- zero hits). The real fix is a NEW read-only capability: the Web UI''s session list reads its own home''s store (single writer, as today) PLUS discovers and read-only-tails other known FREDDIE_HOME session stores (each still single-writer for its own owning process), merging them for display. This is a genuine feature addition, not a bug fix -- likely needs a registry of known homes (a well-known file listing active FREDDIE_HOME paths, updated by each process on boot) and a read-only JSONL tail reader that never claims a writer lock.'
  acceptance: The Web UI's session list displays sessions from other FREDDIE_HOME directories on the same machine (read-only, never claiming their writer lock), verified live by running a second Freddie process under a different FREDDIE_HOME and confirming its session appears in the Web UI's sidebar without being clickable/writable from there, or with a clear read-only/cross-home affordance.
  route_family: state
  status: pending
