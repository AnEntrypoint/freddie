- id: gm-client-no-retry-on-orphaned-dispatch
  title: gm-client dispatch hangs on a dead daemon until timeoutMs
  subject: 'dispatch() polls only for the .ready sentinel. If the shared daemon dies after the in-file is written, the caller waits the full timeoutMs (default 120s) even though isDaemonAlive already exists. World-scope: do not kill the machine-wide daemon to prove this; prove by injecting a dead-pid status or aborting the signal.'
  acceptance: dispatch observes AbortSignal and, on each poll, daemon death via isDaemonAlive; either condition throws a named error without waiting the remaining timeout; live-verified by aborting a fake in-flight poll (no machine-wide daemon kill).
  status: pending
  route_family: state
  session_id: freddie-harness-1
