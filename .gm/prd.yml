- id: gm-tool-exec-signal
  title: Native gm tools ignore exec.signal and have no timeoutMs
  subject: 'packages/gm/tool-gm/src/verbs.js execute(args) never reads exec.signal; Gm.call and dispatch() poll with setTimeout and accept no AbortSignal. Cookbook: Honor exec.signal. Timeout-policy only arms a deadline when timeoutMs is declared; these tools declare none, so a cancelled turn cannot stop an in-flight 120s spool poll.'
  acceptance: Each gm_* execute forwards exec.signal into Gm.call/dispatch so abort stops polling; tools declare timeoutMs matching the spool default (or Config); live-verified by aborting a dispatch and observing it throw rather than wait the full 120s.
  status: pending
  route_family: execution
  session_id: freddie-harness-1
