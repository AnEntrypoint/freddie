  status: resolved
  notes: 'RESOLVED, commit c48ec4a. setProps called #remeasure() on every render: rebuilt the ResizeObserver, then #measure() wrote the remainder probe''s textContent and read its width back on the same synchronous pass up to SHOWN_LIMIT+1 times = a forced reflow per candidate label, on every store fanout including each keystroke''s. Fix: key the measurement on the joined path list (pathsKey helper, used by setProps/connectedCallback), skip remeasure when unchanged; connectedCallback re-keys, disconnectedCallback clears. Settled time 145-179ms -> 93-131ms; getBoundingClientRect (62.9ms) and #measure (22.5ms) left the bottom-up profile. Verified live: narrowing the container to 260px recomputes ''+ 2 files'' -> ''+ 5 files'' and restoring returns it, so the ResizeObserver still owns genuine resizes. NOTE: a literal NUL byte briefly entered this file from an editor-tool escape conversion, making git treat it as binary; caught and removed before the final commit (now UTF-8, 0 NULs, 36 insertions as a real text diff).'
