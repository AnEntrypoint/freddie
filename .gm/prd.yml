- session_id: gmFirstClass-1
  id: agentplug-worker-thread-compile-visibility-race
  title: 'agentplug-runner: per-project worker thread can observe gm plugin as permanently uncompiled despite successful main-thread warm pass'
  subject: 'Live-witnessed today (2026-09-07, ~07:12-07:30 local) against C:/dev/deepseek-harness: daemon.log repeatedly logged ''plugin crux not yet compiled for C:\\dev\\deepseek-harness: dispatch this thread''s own get_or_compile could not run against the shared PluginModules from a worker thread'' for the gm plugin specifically, across three separate daemon restarts (PIDs 6392, 18692, 15032), each time for many minutes (one stretch exceeded 15 minutes) despite: (1) daemon-status.json showing compiled_plugin_modules:5 (all plugins including gm globally compiled), (2) the unconditional per-tick warm pass at daemon.rs:2468 (for plugin_name in ["gm","libsql","bert","treesitter"]) which is NOT gated by known_roots and should make gm visible to every worker every tick, (3) no compile-failure recorded (read_plugin_compile_failure returned None -- the log said ''not yet compiled'', not ''failed to compile''). Every gm dispatch for this project (codesearch, health, phase-status) timed out client-side during these windows; several were later swept as dispatch_orphaned with sweeping_pid matching the live daemon, confirming the daemon itself, not a dead process, held the claim. The project''s own .gm/exec-spool/.status.json heartbeat (ts field) froze during these windows and only resumed once dispatches started succeeding again. Root cause not fully isolated: module_with_hash() (daemon.rs ~line 1884, called from the worker thread) returned None despite the warm pass at line 2472 reporting Ok(()) moments earlier on the same PluginModules struct -- consistent with a stale-read/visibility race between the main-thread compile write and a worker-thread read, exposed under this machine''s real concurrent load (active_projects:102 at the time). Not root-caused to a specific line; needs focused reproduction with logging around module_with_hash''s actual synchronization primitive.'
  acceptance: Root cause identified (the exact synchronization gap between get_or_compile's write and module_with_hash's read) and fixed so a project whose plugin the warm pass just compiled successfully never again logs 'not yet compiled' for that plugin on the very next worker-thread read; reproduced live against a project under real multi-project daemon load (not a synthetic single-project test) before and after the fix, both witnessed via daemon.log and the project's own .gm/exec-spool/.status.json heartbeat resuming immediately rather than after a multi-minute stall.
  route_family: state
  status: pending
