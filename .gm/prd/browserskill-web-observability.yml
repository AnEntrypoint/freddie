title: Integrate BrowserSkill state into Freddie Web
subject: 'Pre: BrowserSkill provider produces tool calls and screenshot paths but Freddie Web has no first-class BrowserSkill session pane or screenshot attachment integration. Invariant: visual browser-task observation is derived from durable tool/session facts and does not leak foreign session or browser-profile data. Post: the Web UI shows owned BrowserSkill activity with correctly bounded, model-visible state.'
