witness: '.gm/witness/latency-sample.txt (dispatch 1791821278459-500-f10083c85190d049): seq20 median 0 p90 90388; git_status median 31068; fs median 0 p90 7137; batch5 median 0 p90 59397'
resolution: 'Attribution (live, 8 instrumented sequential dispatches, polled dispatch_wait ledger at 200ms): total wall 24467ms. claimed_running of git_status (the daemon executing the verb) 15633ms = 63.9%; pre-claim pickup (request not yet in ledger) 6428ms = 26.3%; claimed_waiting_for_serial_lane 2406ms = 9.8%. Lane field is null for git_status and fs_* (no named lane held); the state lane was held only by prd-resolve/instruction/prd-add, not by trivial reads. Slowest git_status dispatches (4351/9486/5602ms) were 100%/81%/85% claimed_running. Trivial fs_stat/fs_readdir waits were claimed_waiting_for_serial_lane behind sibling codesearch claimed_running. Sample: sequential 20 median 0 p90 90388ms (2 of 20 hit the 120s poll timeout, no reply); git_status n=6 median 31068 p90 >=120000; fs n=14 median 0 p90 7137. Batch of 5 parallel: median 0, p90 59397. Largest contributor = shared daemon claimed_running of git_status (the 128-root scan path), not freddie surface; untracked .gm files were not isolated by measurement.'
