id: gm-trivial-verb-latency-freddie
subject: 'A trivial read-only gm verb (fs_stat, fs_readdir, git_status) took 11-21 s of dispatch wait in freddie this session, with prd-add up to 31 s and a state-lane wait of 1-2 minutes when several workers ran at once. Measure where the time goes per lane (admission, claim, serial lane, daemon scan) with a live sample of at least twenty dispatches, and name the single largest contributor. Witness: the sample as a file under .gm/witness with the dispatch ids. Fix only if the cause is in freddie''s own surface; otherwise record the cause against daemon-scan-factor.'
status: completed
