id: token-delivery-output-cap
title: Stop reserving unused output tokens
subject: 'Pre: DeepSeek defaultMaxTokens is 256000 against a 1000000 window. Invariant: an explicit per-request cap still wins over the adapter default. Post: the shipped default no longer pre-allocates a quarter of the window on every chat call unless the endpoint requires it.'
acceptance: live request header records a smaller materialized maxTokens and a chat call still completes.
