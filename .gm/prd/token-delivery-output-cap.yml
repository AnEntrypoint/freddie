witness: Rejected as a shipped default change. settings.yaml sets grok contextWindow 256000 while DEFAULT_MAX_TOKENS is 256000. acptoapi CHANGELOG 1.0.246 and model-token-limits.js shouldOmitMaxTokens already drop max_tokens for xai-oauth before upstream, because xAI subtracts the cap from the prompt budget. Lowering the DeepSeek default would change non-xAI routes without a measured win on this route.
