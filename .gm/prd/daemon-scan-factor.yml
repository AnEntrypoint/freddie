id: daemon-scan-factor
title: Cut the 128-root spool scan that makes git_status 4.8x slower
subject: 'Pre: isolated spool git_status averages 1299ms versus 272ms direct git, daemon active_projects=128, SPOOL_WORK_CACHE_TTL=200ms, Windows wait chunks 64 handles. Invariant: a dispatch written during a wait is still claimed on the next pass, and a side-effecting verb is not re-executed. Post: a rebuilt runner shows isolated git_status within a small factor of direct git without dropping a queued file.'
acceptance: 'Live before/after on the same daemon registry: five isolated spool git_status calls versus five direct git status --porcelain calls, plus one dispatch written during an idle wait that still completes.'
route_family: execution
status: pending
session_id: freddie-107108-1791049571843
witness: 'Attribution (live, 8 instrumented sequential dispatches, polled dispatch_wait ledger at 200ms): total wall 24467ms. claimed_running of git_status (the daemon executing the verb) 15633ms = 63.9%; pre-claim pickup (request not yet in ledger) 6428ms = 26.3%; claimed_waiting_for_serial_lane 2406ms = 9.8%. Lane field is null for git_status and fs_* (no named lane held); the state lane was held only by prd-resolve/instruction/prd-add, not by trivial reads. Slowest git_status dispatches (4351/9486/5602ms) were 100%/81%/85% claimed_running. Trivial fs_stat/fs_readdir waits were claimed_waiting_for_serial_lane behind sibling codesearch claimed_running. Sample: sequential 20 median 0 p90 90388ms (2 of 20 hit the 120s poll timeout, no reply); git_status n=6 median 31068 p90 >=120000; fs n=14 median 0 p90 7137. Batch of 5 parallel: median 0, p90 59397. Largest contributor = shared daemon claimed_running of git_status (the 128-root scan path), not freddie surface; untracked .gm files were not isolated by measurement.'
resolution: 'Attribution recorded from gm-trivial-verb-latency-freddie sample (annotate only, row stays pending): git_status claimed_running is the largest share; route to daemon scan path, not freddie surface.'
