id: gm-readonly-parallel
title: Overlap read-only GM tools
subject: 'Pre: gm tool schemas omit isConcurrencySafe, so every parallel group serializes. Invariant: mutating git and PRD verbs stay exclusive. Post: read-only GM verbs declare isConcurrencySafe and a parallel group starts them together.'
