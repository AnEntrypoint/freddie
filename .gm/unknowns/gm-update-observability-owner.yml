witness_evidence: Gm owns daemon inspection because daemon.js is its provider-local integration; tool-gm owns the durable gm/progress producer; gm-progress owns the projection fold; ui-observability owns its projection rendering. The client remains a pure projection consumer and needs no direct Remote method or daemon access.
