id: composer-hmr-session-cause
subject: Identify why conversation composer InputHub cannot resolve the sessions service during a fresh browser reload and establish whether this can strand live UI updates
status: witnessed
witness_evidence: 'Before the repair, a clean browser reload logged conversation.input: sessions service unavailable from InputHub.sessions during conversation.composer.bar injection. InputHub was resolving sessions lazily with rootCtx.get. After binding the injected sessions service in the InputHub constructor, a new browser session had no console errors and a live prompt streamed its response to completion.'
