subject: The real browser must retain a connected HMR channel and the operational overview must render its new realtime connection status after the streaming performance changes.
text: Witness by navigating the existing local Freddie GUI, entering Overview, and reading both window.__FREDDIE_HMR__.status and its visible connection indicator.
