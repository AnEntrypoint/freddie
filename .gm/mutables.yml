- session_id: perfopt-1788500921
  id: http1-vs-http2-boot-concurrency
  subject: Server runs plain node:http (HTTP/1.1), so Chrome's 6-connections-per-origin cap serializes the ~217-module cold boot into queued waves
  witness: packages/host/webserver/src/index.js:1,118 uses node:http createServer; curl -s -o /dev/null -w http_version confirms 1.1
  status: witnessed
  witness_evidence: HTTP/2 requires TLS for browser negotiation (Chrome does not support h2c); adding TLS to a local dev harness server is disproportionate infra risk for this request. The vendor-immutable-cache fix already removes the dominant repeat-boot cost (per-module revalidation). Remaining HTTP/1.1 connection queueing only affects true cold first-load, an acceptable one-time cost. Investigated and rejected.
