<!doctype html>
<html lang="en" class="ds-247420">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freddie Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AnEntrypoint/design@main/dist/247420.css">
<script type="importmap">
{ "imports": { "anentrypoint-design": "https://cdn.jsdelivr.net/gh/AnEntrypoint/design@main/dist/247420.js" } }
</script>
<style>
html, body { margin: 0; padding: 0; height: 100%; }
#app { height: 100%; }
/* FOUC guard: hide the document until app.js signals ready (after installStyles)
   so #app never paints raw unstyled 'loading...' text. */
body { visibility: hidden; }
body[data-ready] { visibility: visible; }
/* All real component CSS (fd-page stretch rules, fd-tty, fd-session-mux,
   fd-msg-flash/fd-msg-search, the dense chat-composer variant) lives in
   the anentrypoint-design SDK's app-surfaces.css -- see AGENTS.md's
   "no inline CSS beyond reset" rule. Do not re-add component rules here. */
</style>
</head>
<body>
<script>
(function () {
  var t;
  try { t = localStorage.getItem('247420:theme'); } catch (e) {}
  if (!t || t === 'auto') t = 'ink';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<div id="app"></div>
<script type="module" src="./app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () { /* offline shell caching is progressive enhancement -- a failed registration must not block the dashboard */ });
  });
}
</script>
</body>
</html>
