name: test

# Plugin-discovery smoke boot on every push/PR. No automated tests — manual testing only.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Re-resolve github: deps to current default-branch HEAD
        run: npm update acptoapi anentrypoint-design plugsdk --no-audit --no-fund

      - name: Lint (syntax + package.json shape + split/naming warnings)
        run: npm run lint

      - name: Plugin-discovery smoke boot
        run: |
          node -e "
            import('./src/index.js').then(async ({ discoverPlugins }) => {
              const plugins = await discoverPlugins(['plugins']);
              console.log('discovered', plugins.length, 'plugins');
              if (!Array.isArray(plugins)) throw new Error('discoverPlugins did not return an array');
            }).catch((err) => { console.error(err); process.exit(1); });
          "
