- insert:
    - id: timer
      name: '@freddie/cordis-plugin-timer'

    - id: hmr
      name: '@freddie/cordis-plugin-hmr'
      config:
        root: ['.']

    - id: llm
      name: '@freddie/freddie-llm'

    - id: session
      name: '@freddie/freddie-session'

    - id: typert
      name: '@freddie/freddie-typert-registry'

    - id: typert-loader
      name: '@freddie/freddie-typert-loader'

    - id: typert-gateway
      name: '@freddie/freddie-api-gateway'

    - id: session-title
      name: '@freddie/freddie-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@freddie/freddie-session-title-first-prompt-llm'
      config:
        targetWords: 5
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: session-title-all-prompts-llm
      name: '@freddie/freddie-session-title-all-prompts-llm'
      disabled: true
      config:
        targetWords: 5
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: user-questions
      name: '@freddie/freddie-user-questions'

    - id: agent
      name: '@freddie/freddie-agent'

    - id: agent-default-model
      name: '@freddie/freddie-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

    - id: jobs
      name: '@freddie/freddie-jobs-local'

    - id: gm-client
      name: '@freddie/freddie-gm-client'
      config:
        sessionId: !!js process.env.FREDDIE_SESSION_ID || (`freddie-${process.pid}-${Date.now()}`)
        cwd: !!js process.cwd()

    - id: tool-gm
      name: '@freddie/freddie-tool-gm'

    - id: llm-retry
      name: '@freddie/freddie-llm-retry'

    - id: settings
      name: '@freddie/freddie-settings-file'

    - id: credentials
      name: '@freddie/freddie-credentials-local'

    - id: authorization
      name: '@freddie/freddie-authorization'

    - id: session-persistence-jsonl
      name: '@freddie/freddie-session-persistence-jsonl'
      config:
        root: !!js freddieHomePath('sessions')
        extraRoots: !!js "(process.env.FREDDIE_EXTRA_SESSION_ROOTS ?? '').split(process.platform === 'win32' ? ';' : ':').map(s => s.trim()).filter(Boolean)"

    - id: attachment-local
      name: '@freddie/freddie-attachment-local'

    - id: session-query-sqlite
      name: '@freddie/freddie-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: first-search

    - id: tool-session-query
      name: '@freddie/freddie-tool-session-query'

    - id: session-projection
      name: '@freddie/freddie-session-projection'

    - id: session-turn-outline
      name: '@freddie/freddie-session-turn-outline'

    - id: gm-progress
      name: '@freddie/freddie-gm-progress'

    - id: session-telemetry-otel
      name: '@freddie/freddie-session-telemetry-otel'
      config:
        mode: !!js process.env.FREDDIE_TELEMETRY_MODE || 'DISABLED'
        shutdownTimeoutMillis: 3000
        exporter:
          url: !!js process.env.FREDDIE_TELEMETRY_OTLP_URL || undefined
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: inspector
      name: '@freddie/freddie-inspector'
      config:
        enabled: false

    - id: subprocess
      name: '@freddie/freddie-subprocess-local'

    - id: computer-use
      name: '@freddie/freddie-computer-use'

    - id: browser-use
      name: '@freddie/freddie-browser-use'

    - id: browser-use-chrome-devtools-mcp
      name: '@freddie/freddie-experimental-browser-use-chrome-devtools-mcp'
      config:
        mode: launch
        headless: true
        excludePresets: [minimal]

    - id: terminal
      name: '@freddie/freddie-terminal'

    - id: terminal-bash
      name: '@freddie/freddie-terminal-bash'
      config:
        shellDialect: !!js "process.platform === 'win32' ? 'pwsh' : 'bash'"

    - id: sandbox
      name: '@freddie/freddie-sandbox-local'

    - id: sandbox-policy
      name: '@freddie/freddie-sandbox-policy'
      config:
        mode: !!js process.env.FREDDIE_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@freddie/freddie-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@freddie/freddie-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@freddie/freddie-user-approval'
      config:
        policy: !!js "(process.env.FREDDIE_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@freddie/freddie-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: auto-review
      name: '@freddie/freddie-auto-review'
      config:
        preset: auto
        advertise: true
        timeoutMs: 60000
        maxOutputTokens: 2048
        maxInputBytes: 262144

    - id: shell-env
      name: '@freddie/freddie-shell-env'

    - id: tool-bash
      name: '@freddie/freddie-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@freddie/freddie-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@freddie/freddie-tool-jobs'

    - id: fs-observation-policy
      name: '@freddie/freddie-fs-observation-policy'

    - id: tool-fs
      name: '@freddie/freddie-tool-fs'

    - id: tool-fs-search
      name: '@freddie/freddie-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@freddie/freddie-agent-instructions'
      config:
        maxBytes: 65536

    - id: time-context
      name: '@freddie/freddie-time-context'
      config:
        refreshIntervalMs: 60000

    - id: tmux-context
      name: '@freddie/freddie-tmux-context'

    - id: skill
      name: '@freddie/freddie-skill'

    - id: skill-filesystem
      name: '@freddie/freddie-skill-filesystem'

    - id: skill-badge
      name: '@freddie/freddie-skill-badge'
      disabled: true

    - id: tool-skill
      name: '@freddie/freddie-tool-skill'

    - id: commands
      name: '@freddie/freddie-commands'

    - id: command-feedback
      name: '@freddie/freddie-command-feedback'

    - id: goal
      name: '@freddie/freddie-goal'

    - id: goal-round-driver
      name: '@freddie/freddie-goal-round-driver'

    - id: command-goal
      name: '@freddie/freddie-command-goal'

    - id: plan-mode
      name: '@freddie/freddie-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@freddie/freddie-token-meter'

    - id: compaction-basic
      name: '@freddie/freddie-compaction-basic'

    - id: compaction-image-offload
      name: '@freddie/freddie-compaction-image-offload'

    - id: command-compact
      name: '@freddie/freddie-command-compact'

    - id: subagent
      name: '@freddie/freddie-subagent'

    - id: subagent-spawn-in-process
      name: '@freddie/freddie-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@freddie/freddie-subagent-fork-in-process'
      config:
        providerName: fork

    - id: tool-subagent-control
      name: '@freddie/freddie-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@freddie/freddie-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@freddie/freddie-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@freddie/freddie-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    - id: tool-subagent-report
      name: '@freddie/freddie-tool-subagent-report'

    - id: workflow-worker-thread
      name: '@freddie/freddie-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@freddie/freddie-tool-workflow'

    - id: timeout-policy
      name: '@freddie/freddie-tool-call-timeout-policy'

    - id: spill-local
      name: '@freddie/freddie-spill-local'

    - id: spill-policy
      name: '@freddie/freddie-spill-policy'
      config:
        maxInlineBytes: 50000

    - id: session-checkpoint-policy
      name: '@freddie/freddie-session-checkpoint-policy'

    - id: tool-result-pruner
      name: '@freddie/freddie-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: tool-todo
      name: '@freddie/freddie-tool-todo'
      config:
        allowParallelInProgress: true

    - id: tool-goal
      name: '@freddie/freddie-tool-goal'

    - id: tool-ralph
      name: '@freddie/freddie-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    - id: tool-str-replace-editor
      name: '@freddie/freddie-tool-str-replace-editor'
      disabled: true
      config:
        maxOutputChars: 16000

    - id: repeat-tool-reminder
      name: '@freddie/freddie-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    - id: web
      name: '@freddie/freddie-web'
      config:
        searchProvider: browser-google
        fetchProvider: http

    - id: web-search-browser
      name: '@freddie/freddie-web-search-browser'
      config:
        timeoutMs: 60000

    - id: web-fetch-http
      name: '@freddie/freddie-web-fetch-http'
      config:
        timeoutMs: 45000

    - id: tool-web
      name: '@freddie/freddie-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    - id: tools
      name: '@freddie/freddie-tools'

    - id: system-prompt
      name: '@freddie/freddie-system-prompt'
      config:
        persona: ''
        toolOrder: !!js "process.platform === 'win32' ? ['read', 'edit', 'write', 'grep', 'glob', 'pwsh', 'skill', 'todo_write', 'workflow', 'ralph', 'gm_instruction', 'gm_codesearch', 'gm_phase_status', '<unlisted-tools>'] : ['read', 'edit', 'write', 'grep', 'glob', 'bash', 'skill', 'todo_write', 'workflow', 'ralph', 'gm_instruction', 'gm_codesearch', 'gm_phase_status', '<unlisted-tools>']"

    - id: agent-loop
      name: '@freddie/freddie-agent-loop'
      config:
        agents: []

    - id: fs-sandbox
      name: '@freddie/freddie-fs-sandbox'

    - id: llm-deepseek
      name: '@freddie/freddie-llm-deepseek'

    - id: llm-pi-ai
      name: '@freddie/freddie-llm-pi-ai'
      config:
        providers: {}
