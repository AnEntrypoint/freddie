- id: session-title-llm
  disabled: true

- id: hmr
  disabled: true

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- insert:
    - id: acp-startup
      name: '@freddie/freddie-acp-app/startup'

    - id: acp
      name: '@freddie/freddie-acp'
      inject: [acpStartup]
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
