- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
    toolOrder: !!js "process.platform === 'win32' ? ['read', 'edit', 'write', 'grep', 'glob', 'pwsh', 'skill', 'todo_write', 'workflow', 'ralph', 'gm_instruction', 'gm_codesearch', 'gm_phase_status', '<unlisted-tools>'] : ['read', 'edit', 'write', 'grep', 'glob', 'bash', 'skill', 'todo_write', 'workflow', 'ralph', 'gm_instruction', 'gm_codesearch', 'gm_phase_status', '<unlisted-tools>']"

- id: hmr
  config:
    root: []
    usePolling: true

- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

- id: tools
  config:
    mode: !!js process.env.FREDDIE_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@freddie/freddie-code-runtime-worker-thread'

    - id: storage
      name: '@freddie/freddie-storage'

    - id: storage-json
      name: '@freddie/freddie-storage-json'
      config:
        root: !!js freddieHomePath('storages')

    - id: storage-domain
      name: '@freddie/freddie-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@freddie/freddie-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: session-log-download
      name: '@freddie/freddie-session-log-export'

    - id: workspace
      name: '@freddie/freddie-workspace'

    - id: session-projection-cache
      name: '@freddie/freddie-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-artifacts
      name: '@freddie/freddie-session-artifacts'

    - id: session-reference
      name: '@freddie/freddie-session-reference'

    - id: file-reference-local
      name: '@freddie/freddie-file-reference-local'

    - id: session-stats
      name: '@freddie/freddie-session-stats'

    - id: directory-picker
      name: '@freddie/freddie-host-directory-picker-auto'

    - id: plugin-inventory
      name: '@freddie/freddie-host-plugin-inventory'

    - id: api-gateway
      name: '@freddie/freddie-host-apiproxy'

    - id: remote-stream
      name: '@freddie/freddie-remote-stream'

    - id: session-controller
      name: '@freddie/freddie-session-controller'

    - id: terminal-controller
      name: '@freddie/freddie-terminal-controller'

    - id: job-controller
      name: '@freddie/freddie-job-controller'

    - id: settings-controller
      name: '@freddie/freddie-api-settings-controller'

    - id: workspace-controller
      name: '@freddie/freddie-api-workspace-controller'

    - id: workspace-files
      name: '@freddie/freddie-api-workspace-files'

    - id: cordis-host-runner
      name: '@freddie/freddie-cordis-host-runner'

    - id: web-startup
      name: '@freddie/freddie-web-app/startup'

    - id: webserver
      name: '@freddie/freddie-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080

    - id: web-runtime
      name: '@freddie/freddie-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    - id: client-hmr
      name: '@freddie/freddie-client-hmr'

    - id: file-upload
      name: '@freddie/freddie-client-file-upload'

    - id: open-in-app
      name: '@freddie/freddie-host-open-in-app'

    - id: product-telemetry-otel
      name: '@freddie/freddie-host-product-telemetry-otel'
      disabled: true

    - id: config-editor
      name: '@freddie/freddie-config-editor'
      config:
        profile: web

    - id: plugin-manager
      name: '@freddie/freddie-plugin-manager'

    - id: plugin-manager-controller
      name: '@freddie/freddie-api-plugin-manager-controller'

    - id: modules
      name: '@freddie/freddie-client-modules'

    - id: css-manifest
      name: '@freddie/freddie-client-css-manifest'

    - id: vendor-modules
      name: '@freddie/freddie-client-vendor-modules'

    - id: connection
      name: '@freddie/freddie-client-connection'
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    - id: api-remotes
      name: '@freddie/freddie-api-remotes'

    - id: client-runtime
      name: '@freddie/freddie-client-runtime'

    - id: cordis-client-runner
      name: '@freddie/freddie-cordis-client-runner'

    - id: ui-theme
      name: '@freddie/freddie-client-ui-theme'

    - id: locale
      name: '@freddie/freddie-client-locale'

    - id: ui-layout
      name: '@freddie/freddie-client-ui-layout'

    - id: ui-renderer
      name: '@freddie/freddie-client-ui-renderer'

    - id: ui-sidebar
      name: '@freddie/freddie-client-ui-sidebar'

    - id: ui-settings
      name: '@freddie/freddie-client-ui-settings'

    - id: ui-settings-general
      name: '@freddie/freddie-client-ui-settings-general'

    - id: ui-settings-models
      name: '@freddie/freddie-client-ui-settings-models'

    - id: ui-settings-plugin-inventory
      name: '@freddie/freddie-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@freddie/freddie-client-ui-conversation'

    - id: ui-brand-official
      name: '@freddie/freddie-client-ui-brand-official'

    - id: ui-attachment
      name: '@freddie/freddie-client-ui-attachment'

    - id: ui-tool
      name: '@freddie/freddie-client-ui-tool'

    - id: ui-cordis
      name: '@freddie/freddie-client-ui-cordis'

    - id: ui-workflow-run
      name: '@freddie/freddie-client-ui-workflow-run'

    - id: ui-deliverables
      name: '@freddie/freddie-client-ui-deliverables'

    - id: ui-workspace
      name: '@freddie/freddie-client-ui-workspace'

    - id: ui-input-trigger
      name: '@freddie/freddie-client-ui-input-trigger'

    - id: ui-commands
      name: '@freddie/freddie-client-ui-commands'

    - id: ui-skill
      name: '@freddie/freddie-client-ui-skill'

    - id: ui-subagent
      name: '@freddie/freddie-client-ui-subagent'

    - id: ui-reference
      name: '@freddie/freddie-client-ui-reference'

    - id: ui-jobs
      name: '@freddie/freddie-client-ui-jobs'

    - id: ui-open-in-app
      name: '@freddie/freddie-client-ui-open-in-app'

    - id: ui-goal
      name: '@freddie/freddie-client-ui-goal'

    - id: ui-observability
      name: '@freddie/freddie-client-ui-observability'

    - id: ui-artifacts
      name: '@freddie/freddie-client-ui-artifacts'

    - id: ui-workspace-files
      name: '@freddie/freddie-client-ui-workspace-files'

    - id: ui-message-feedback
      name: '@freddie/freddie-client-ui-message-feedback'

    - id: ui-model-selection
      name: '@freddie/freddie-client-ui-model-selection'

    - id: ui-permission
      name: '@freddie/freddie-client-ui-permission-presets'

    - id: ui-agent-preset
      name: '@freddie/freddie-client-ui-agent-preset'

    - id: ui-settings-plugins
      name: '@freddie/freddie-client-ui-settings-plugins'

    - id: ui-settings-subagent
      name: '@freddie/freddie-client-ui-settings-subagent'

    - id: ui-settings-web-search
      name: '@freddie/freddie-client-ui-settings-web-search'

    - id: ui-plan
