- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
    toolOrder: !!js "process.platform === 'win32' ? ['read', 'edit', 'write', 'grep', 'glob', 'pwsh', 'skill', 'todo_write', 'workflow', 'ralph', '<unlisted-tools>'] : ['read', 'edit', 'write', 'grep', 'glob', 'bash', 'skill', 'todo_write', 'workflow', 'ralph', '<unlisted-tools>']"

- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.FREDDIE_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@freddie/freddie-code-runtime-worker-thread'

    - id: headless-startup
      name: '@freddie/freddie-headless/startup'

    - id: headless-runner
      name: '@freddie/freddie-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
