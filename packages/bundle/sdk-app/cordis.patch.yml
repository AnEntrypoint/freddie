- id: session-title-llm
  disabled: true

- id: hmr
  disabled: true

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- insert:
    - id: sdk-startup
      name: '@freddie/freddie-sdk-app/startup'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@freddie/freddie-sdk-jsonrpc-server'
      inject: [sdkStartup]
      config:
        maxTokensAsSuccess: !!js "process.env.FREDDIE_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.FREDDIE_MAX_TOKENS_AS_SUCCESS)"
