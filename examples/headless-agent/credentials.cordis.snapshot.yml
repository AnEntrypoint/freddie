- id: base
  name: '@freddie/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@freddie/freddie-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-deepseek-keyless
            name: '@freddie/freddie-llm-deepseek'
            config:
              baseURL: 'http://127.0.0.1:9'
