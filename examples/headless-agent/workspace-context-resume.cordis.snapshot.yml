- id: persistence
  name: '@freddie/freddie-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@freddie/freddie-llm-replay'
  config:
    file: !!js process.env.FREDDIE_SNAPSHOT_FILE
    overrideFile: !!js process.env.FREDDIE_SNAPSHOT_OVERRIDE

- id: fs-local
  name: '@freddie/freddie-fs-local'
  config:
    cwd: !!js process.cwd()

- id: agent
  name: '@freddie/freddie-agent-spine-demo'
  config:
    agents: []
    workspaceContext:
      maxBytes: 65536
      freddieHome: !!js process.cwd() + '/.freddie'
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: resumed-agent
  name: './tests/fixtures/workspace-context-resume-agent.ts'
