- id: persistence
  name: '@freddie/freddie-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@freddie/freddie-llm-replay'

- id: sandbox-policy
  name: '@freddie/freddie-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: fs-sandbox
  name: '@freddie/freddie-fs-sandbox'

- id: fs-observation-policy
  name: '@freddie/freddie-fs-observation-policy'

- id: tool-fs
  name: '@freddie/freddie-tool-fs'

- id: agent
  name: '@freddie/freddie-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: subagent
  name: '@freddie/freddie-subagent'

- id: subagent-spawn-in-process
  name: '@freddie/freddie-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@freddie/freddie-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- id: resumed-agent
  name: './tests/fixtures/subagent-inheritance-agent.ts'
