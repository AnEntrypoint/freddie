- id: base
  name: '@freddie/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@freddie/freddie-llm-deepseek'
        disabled: true
      - insert:
          - id: goal
            name: '@freddie/freddie-goal'
          - id: tool-goal
            name: '@freddie/freddie-tool-goal'
          - id: llm-replay
            name: '@freddie/freddie-llm-replay'
