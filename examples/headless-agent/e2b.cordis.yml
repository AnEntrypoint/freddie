- id: base
  name: '@freddie/cordis-plugin-include'
  config:
    path: ./advanced.cordis.yml
    patches:
      - id: subprocess
        name: '@freddie/freddie-subprocess-local'
        disabled: true
      - id: fs-local
        name: '@freddie/freddie-fs-local'
        disabled: true
      - insert:
          - id: e2b
            name: '@freddie/freddie-e2b'
            config:
              cwd: !!js process.cwd()
              timeoutMs: 300000
          - id: subprocess-e2b
            name: '@freddie/freddie-subprocess-e2b'
          - id: fs-e2b
            name: '@freddie/freddie-fs-e2b'
          - id: sandbox-policy
            name: '@freddie/freddie-sandbox-policy'
            config:
              mode: danger-full-access
              workspaceRoot: !!js process.cwd()
          - id: pty
            name: '@freddie/freddie-terminal'
          - id: terminal-bash
            name: '@freddie/freddie-terminal-bash'
          - id: tool-terminal
            name: '@freddie/freddie-tool-terminal'
