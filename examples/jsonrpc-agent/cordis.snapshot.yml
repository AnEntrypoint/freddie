- id: base
  name: '@freddie/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@freddie/freddie-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@freddie/freddie-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
