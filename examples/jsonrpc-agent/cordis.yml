- id: sdk-jsonrpc-server
  name: '@freddie/freddie-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.FREDDIE_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.FREDDIE_MAX_TOKENS_AS_SUCCESS)"

- id: llm-deepseek
  name: '@freddie/freddie-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: subprocess
  name: '@freddie/freddie-subprocess-local'

- id: bash
  name: '@freddie/freddie-bash-local'
  config:
    cwd: !!js process.env.FREDDIE_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@freddie/freddie-agent-spine-demo'
  config:
    persona: !!js process.env.FREDDIE_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@freddie/freddie-session-persistence-jsonl'
  config:
    root: !!js process.env.FREDDIE_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.FREDDIE_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@freddie/freddie-session-checkpoint-policy'

- id: subagent
  name: '@freddie/freddie-subagent'

- id: subagent-spawn-in-process
  name: '@freddie/freddie-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@freddie/freddie-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@freddie/freddie-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@freddie/freddie-fs-local'
  config:
    cwd: !!js process.env.FREDDIE_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@freddie/freddie-fs-observation-policy'

- id: tool-fs
  name: '@freddie/freddie-tool-fs'

- id: token-meter
  name: '@freddie/freddie-token-meter'

- id: compaction-basic
  name: '@freddie/freddie-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
