- id: base
  name: '@freddie/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: session-title-provider
            name: '@freddie/freddie-session-title-first-prompt-llm'
            config:
              targetWords: 5
              maxInputBytes: 4096
              maxOutputTokens: 32
              timeoutMs: 5000
              provider: deepseek-official
              model: deepseek-v4-flash
