- id: llm-deepseek
  name: '@freddie/freddie-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro
      - id: deepseek-v4-flash-vision-exp
        inputModalities: [text, image]

- id: sandbox
  name: '@freddie/freddie-sandbox-local'

- id: sandbox-policy
  name: '@freddie/freddie-sandbox-policy'
  config:
    mode: !!js "process.env.FREDDIE_PERMISSION_MODE ?? (process.env.FREDDIE_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')"
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@freddie/freddie-subprocess-local'

- id: bash
  name: '@freddie/freddie-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@freddie/freddie-user-approval'
  config:
    policy: !!js "(process.env.FREDDIE_PERMISSION_MODE ?? (process.env.FREDDIE_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')) === 'danger-full-access' ? 'never' : 'ask'"

- id: acp-agent
  name: '@freddie/freddie-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.FREDDIE_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.FREDDIE_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: token-meter
  name: '@freddie/freddie-token-meter'

- id: compaction-basic
  name: '@freddie/freddie-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

- id: session-projection
  name: '@freddie/freddie-session-projection'

- id: subagent
  name: '@freddie/freddie-subagent'

- id: subagent-spawn-in-process
  name: '@freddie/freddie-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@freddie/freddie-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent-control
  name: '@freddie/freddie-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@freddie/freddie-tool-subagent-control/list-agents'

- id: tool-subagent-report
  name: '@freddie/freddie-tool-subagent-report'

- id: tool-subagent
  name: '@freddie/freddie-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

- id: tool-subagent-fork
  name: '@freddie/freddie-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1


- id: workflow-worker-thread
  name: '@freddie/freddie-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@freddie/freddie-tool-workflow'

- id: tool-ralph
  name: '@freddie/freddie-tool-ralph'
- id: tool-todo
  name: '@freddie/freddie-tool-todo'
  config:
    allowParallelInProgress: true

- id: repeat-tool-reminder
  name: '@freddie/freddie-repeat-tool-reminder'

- id: fs-sandbox
  name: '@freddie/freddie-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@freddie/freddie-fs-observation-policy'

- id: tool-fs
  name: '@freddie/freddie-tool-fs'
