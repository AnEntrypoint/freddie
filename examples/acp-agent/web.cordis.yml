- id: base
  name: '@freddie/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: web
            name: '@freddie/freddie-web'
          - id: web-fetch-http
            name: '@freddie/freddie-web-fetch-http'
          - id: web-fetch-fixture
            name: './web-fetch-fixture-server.mjs'
          - id: tool-web
            name: '@freddie/freddie-tool-web'
            config:
              search: false
