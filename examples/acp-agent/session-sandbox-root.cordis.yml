- id: base
  name: '@freddie/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: sandbox-policy
        name: '@freddie/freddie-sandbox-policy'
        config:
          mode: !!js "process.env.FREDDIE_PERMISSION_MODE ?? (process.env.FREDDIE_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')"
          workspaceRoot: /tmp
